<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaloChale - SignUp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div class="container-fluid px-0">
      <div class="row">
        <div class="col-md-12">
          <!-- navbar start -->
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarTogglerDemo03"
                aria-controls="navbarTogglerDemo03"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>

              <a class="navbar-brand text-primary" href="#">ChaloChale</a>

              <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="destinations.html"
                      >Destination</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="packages.html"
                      >Packages</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="booking.html"
                      >Booking</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="conatct.html"
                      >Contact</a
                    >
                  </li>
                </ul>

                <!-- SignUp and SignIn Buttons -->
                <div class="d-flex gap-2">
                  <a href="signup.html" class="btn btn-warning">SignUp</a>
                  <a href="signin.html" class="btn btn-warning">SignIn</a>
                </div>
              </div>
            </div>
          </nav>
          <!-- navbar ends -->
        </div>
      </div>

      <main class="signup-page">
        <div class="container">
          <div class="row justify-content-center">
            <section class="col-12 col-sm-10 col-md-8 col-lg-6 my-5">
              <div class="signup-panel">
                <h1 class="text-center mb-2">Create an account</h1>
                <p class="signup-intro text-center mb-4">
                  Sign up to start planning your next journey.
                </p>
                <form class="row g-3">
                  <div class="col-12">
                    <label for="fullname" class="form-label">Full name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="fullname"
                      name="fullname"
                      autocomplete="name"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="inputEmail4"
                      name="email"
                      autocomplete="email"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label for="inputPassword4" class="form-label"
                      >Password</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      id="inputPassword4"
                      name="password"
                      autocomplete="new-password"
                      minlength="8"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-success w-100">
                      Sign Up
                    </button>
                  </div>
                </form>
                <p class="text-center mt-4 mb-0">
                  Already have an account?
                  <a href="signin.html">Sign In</a>
                </p>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-4">
      <p class="mb-0">
        &copy; 2026 ChaloChale Travel App | Designed with Bootstrap.
      </p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./JS/script.js"></script>
  </body>
</html>
