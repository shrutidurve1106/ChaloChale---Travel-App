<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaloChale - Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div class="container-fluid px-0">
      <div class="row">
        <div class="col-md-12">
          <!-- navbar start -->
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarTogglerDemo03"
                aria-controls="navbarTogglerDemo03"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>

              <a class="navbar-brand text-primary" href="index.html"
                >ChaloChale</a
              >

              <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="destinations.html"
                      >Destination</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="packages.html"
                      >Packages</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="booking.html"
                      >Booking</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="contact.html"
                      >Contact</a
                    >
                  </li>
                </ul>

                <!-- SignUp and SignIn Buttons -->
                <div class="d-flex gap-2">
                  <a href="signup.html" class="btn btn-warning">SignUp</a>
                  <a href="signin.html" class="btn btn-warning">SignIn</a>
                </div>
              </div>
            </div>
          </nav>
          <!-- navbar ends -->
        </div>
      </div>
    </div>

    <main class="booking-page">
      <div class="container py-4 py-md-5">
        <div class="row justify-content-center">
          <section class="col-12 col-lg-8 col-xl-7">
            <div class="booking-panel">
              <header class="mb-4">
                <p class="booking-eyebrow mb-2">We'd love to hear from you</p>
                <h1 class="mb-2">Get in touch</h1>
                <p class="booking-intro mb-0">
                  Send us a note and our travel team will be happy to help.
                </p>
              </header>

              <form id="contactForm">
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="contactName" class="form-label"
                      >Full name</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="contactName"
                      name="name"
                      placeholder="Enter your name"
                      autocomplete="name"
                      required
                    />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="contactEmail" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="contactEmail"
                      name="email"
                      placeholder="Enter your email"
                      autocomplete="email"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label for="contactSubject" class="form-label"
                      >Subject</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="contactSubject"
                      name="subject"
                      placeholder="What can we help with?"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label for="contactMessage" class="form-label"
                      >Message</label
                    >
                    <textarea
                      class="form-control"
                      id="contactMessage"
                      name="message"
                      rows="5"
                      placeholder="Write your message here"
                      required
                    ></textarea>
                  </div>
                  <div class="col-12 pt-2">
                    <button type="submit" class="btn btn-primary w-100">
                      Send message
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
      <p class="mb-0">
        &copy; 2026 ChaloChale Travel App | Designed with Bootstrap.
      </p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./JS/script.js"></script>
  </body>
</html>
